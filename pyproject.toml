[project]
name = "myps"
version = "0.1.0"
description = "Process tree viewer for current user with filtering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.0.0",
    "rich>=14.1.0",
]

[project.scripts]
myps = "myps:cli.main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.13.2",
    "types-psutil>=7.0.0.20251001",
    "pytest>=8.4.2",
]
